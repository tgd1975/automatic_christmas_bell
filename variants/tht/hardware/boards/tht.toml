# Board tht of christmas-bell: outline, holes, placement, routing, pours, silk – the PCB designer's file,
# in the layout hash (edakit handbook 10.2)

revision = "1.0"                 # board revision: printed bottom left with the title (edakit silk)
view = "top"
edge_ok = ["U1", "J1"]           # the Nano's USB socket at the edge, the servo plug

[outline]
rect = [85, 56]
corner_radius = 2

[[holes]]
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[holes]]
x = 81.5
y = 3.5
d = 3.2
keep = 3.2

[[holes]]
x = 3.5
y = 52.5
d = 3.2
keep = 3.2

[[holes]]
x = 81.5
y = 52.5
d = 3.2
keep = 3.2

[place]                          # Nano, LEDs, C1, J1, buttons as on the main board; THT resistors where they fit
U1 = { x = 22.6, y = 28, rot = 270, side = "top" }  # footprint drawn upright: 270 puts the USB end left
LED5 = { x = 30, y = 48, rot = 0, side = "top" }
LED4 = { x = 40, y = 48, rot = 0, side = "top" }
LED3 = { x = 50, y = 48, rot = 180, side = "top" }  # yellow footprint has its "+" on pad 2
LED2 = { x = 60, y = 48, rot = 180, side = "top" }  # yellow footprint has its "+" on pad 2
LED1 = { x = 70, y = 48, rot = 0, side = "top" }
J1 = { x = 80, y = 30, rot = 90, side = "top" }
C1 = { x = 69.5, y = 30, rot = 0, side = "top" }  # next to J1 (near_mm 6)
S1 = { x = 58, y = 12, rot = 0, side = "top" }
S2 = { x = 72, y = 12, rot = 0, side = "top" }
R4 = { x = 30, y = 40, rot = 0, side = "top" }    # series resistors (10.5 mm pitch) below their LEDs, staggered
R3 = { x = 40, y = 43, rot = 0, side = "top" }
R2 = { x = 50, y = 40, rot = 0, side = "top" }
R1 = { x = 60, y = 43, rot = 0, side = "top" }
R5 = { x = 70, y = 40, rot = 0, side = "top" }
R7 = { x = 51.5, y = 12, rot = 90, side = "top" }  # pull-downs next to their buttons
R6 = { x = 65, y = 12, rot = 90, side = "top" }
R8 = { x = 49, y = 28, rot = 90, side = "top" }    # base load 1 W THT (15.5 mm pitch) between the Nano and C1,
R9 = { x = 55, y = 28, rot = 90, side = "top" }    # 0.25 W each, 6 mm apart

[near]
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"
C1 = "J1"

[routing]
clearance_mil = 12               # hand-soldered: more room between track and pad than the 8 mil of the assembled boards (M-5)
signal_mil = 12
via = [24, 12]
edge_clearance_um = 400
passes = 40
attempts = 5
layer_cost = { TOP = [2.5, 3.5], BOTTOM = [1.0, 1.5] }  # tracks preferably on the bottom: the top is the visible side (M-5)

# The Nano footprint brings four NPTH holes Ø1.9 mm at its corners (local ±7.62 / ±20.32 mm, D-7). Freerouting
# does not see them, and a track once ran 0.11 mm past one (DRC): keep tracks and vias 1.3 mm from their centres.
[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [0.98, 19.08, 3.58, 21.68]

[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [0.98, 34.32, 3.58, 36.92]

[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [41.62, 19.08, 44.22, 21.68]

[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [41.62, 34.32, 44.22, 36.92]

[routing.classes]
POWER = { width_mil = 30, nets = ["+5V"] }
GND = { width_mil = 30, nets = ["GND"] }

[[pours]]
net = "GND"
layers = ["TOP", "BOTTOM"]

[silk]
designators = "top"
label_h_mm = 1.0
board_label = "Weihnachtsglocke THT rev {revision}"   # bottom left, German like the greeting

