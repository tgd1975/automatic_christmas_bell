# edakit project file of the Christmas bell, variant THT – reference: edakit/handbook/10-reference.md
#
# The circuit of the main board (../../edakit.toml) with through-hole parts only and no assembly: a bare board, every
# part soldered by hand (D-12). Board 85 x 56 mm like the main board; its own board "tht" in the EasyEDA project
# christmas-bell.

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "tht"
graph = "hardware/graph.json"
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
ground = "GND"
quantity = 5

[boards.tht]
title = "Christmas bell THT"
template = "generated_tht"
schematic = "layout_tht"
pcb = "tht"
revision = "1.0"                 # board revision: printed bottom left with the title (edakit silk)
view = "top"
edge_ok = ["U1", "J1"]           # the Nano's USB socket at the edge, the servo plug

[boards.tht.outline]
rect = [85, 56]
corner_radius = 2

[[boards.tht.holes]]
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.tht.holes]]
x = 81.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.tht.holes]]
x = 3.5
y = 52.5
d = 3.2
keep = 3.2

[[boards.tht.holes]]
x = 81.5
y = 52.5
d = 3.2
keep = 3.2

[boards.tht.place]               # Nano, LEDs, C1, J1, buttons as on the main board; THT resistors where they fit
U1 = { x = 22.6, y = 28, rot = 270, side = "top" }  # footprint drawn upright: 270 puts the USB end left
LED5 = { x = 30, y = 48, rot = 0, side = "top" }
LED4 = { x = 40, y = 48, rot = 0, side = "top" }
LED3 = { x = 50, y = 48, rot = 180, side = "top" }  # yellow footprint has its "+" on pad 2
LED2 = { x = 60, y = 48, rot = 180, side = "top" }  # yellow footprint has its "+" on pad 2
LED1 = { x = 70, y = 48, rot = 0, side = "top" }
J1 = { x = 80, y = 30, rot = 90, side = "top" }
C1 = { x = 64, y = 30, rot = 0, side = "top" }
S1 = { x = 58, y = 12, rot = 0, side = "top" }
S2 = { x = 72, y = 12, rot = 0, side = "top" }
R4 = { x = 30, y = 40, rot = 0, side = "top" }    # series resistors (10.5 mm pitch) below their LEDs, staggered
R3 = { x = 40, y = 43, rot = 0, side = "top" }
R2 = { x = 50, y = 40, rot = 0, side = "top" }
R1 = { x = 60, y = 43, rot = 0, side = "top" }
R5 = { x = 70, y = 40, rot = 0, side = "top" }
R7 = { x = 51.5, y = 12, rot = 90, side = "top" }  # pull-downs next to their buttons
R6 = { x = 65, y = 12, rot = 90, side = "top" }
R8 = { x = 49, y = 28, rot = 90, side = "top" }    # base load 1 W THT (15.5 mm pitch) between the Nano and C1,
R9 = { x = 55, y = 28, rot = 90, side = "top" }    # 0.25 W each, 6 mm apart

[boards.tht.near]
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"
C1 = "J1"

[boards.tht.routing]
clearance_mil = 8
signal_mil = 12
via = [24, 12]
edge_clearance_um = 400
passes = 40
attempts = 5
layer_cost = { TOP = [1.0, 1.8], BOTTOM = [1.5, 2.5] }

[boards.tht.routing.classes]
POWER = { width_mil = 30, nets = ["+5V"] }
GND = { width_mil = 30, nets = ["GND"] }

[[boards.tht.pours]]
net = "GND"
layers = ["TOP", "BOTTOM"]

[boards.tht.silk]
designators = "top"
label_h_mm = 1.0
board_label = "Weihnachtsglocke THT rev {revision}"   # bottom left, German like the greeting

