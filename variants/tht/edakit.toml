[schematic]
stub = 10

[schematic.layout]
power_flags = { GND = "Ground", "+5V" = "Power" }
rows = [
  [ [ { title = "Arduino Nano", start = ["U1"] } ], [ { title = "Servo", start = ["J1"] } ] ],
  [ [ { title = "Notes" } ] ],
]
near = { C1 = "J1", R8 = "U1", R9 = "U1" }

[schematic.layout.notes]
"Arduino Nano" = ["Plugged into two 1x15 female headers, powered through its USB socket",
                  "D2-D6: countdown LEDs, D8: servo, D11/D12: start/reset buttons",
                  "Symbol pins are ATmega ports; pins 14/15 are labelled PB4/PB3 – on the Nano they are D11 = PB3, D12 = PB4"]
Servo = ["Servo at the Nano's 5V pin; C1 buffers its start-up peaks"]
Notes = ["Nets with the same name are connected (labels and power flags).",
         "Variant THT (D-12): through-hole parts only, no assembly – every part",
         "is soldered by hand.",
         "LED1, LED4, LED5: the library symbols name A and K the other way round;",
         "the anode is the pad with the + print (footprint), see hardware/parts.",
         "R8 + R9: base load, keeps USB power banks on (D-8)."]

[sim]
config = "hardware/sim.json"

[checks]
pin_locks = { "U1.5" = "LED_Y1", "U1.6" = "LED_Y2", "U1.7" = "LED_R", "U1.8" = "LED_G2", "U1.9" = "LED_G1", "U1.11" = "SERVO", "U1.14" = "BTN_START", "U1.15" = "BTN_RESET" }

[release]
signoff = "hardware/signoff.json"
layout_files = ["edakit.toml"]
assembly = { sides = [] }        # no assembly: the BOM is empty, everything is hand-soldered (D-12)
