# edakit project file of the Christmas bell, variant THT – reference: edakit/handbook/10-reference.md
#
# The circuit of the main board (../../edakit.toml) with through-hole parts only and no assembly: a bare board, every
# part soldered by hand (D-12). Board 85 x 56 mm like the main board; its own board "tht" in the EasyEDA project
# christmas-bell.

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "tht"
graph = "hardware/graph.toml"
requirements = ["../../hardware/requirements.toml", "../../hardware/requirements_nano.toml"]   # what the circuit must do: shared, then per module (D-32)
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
quantity = 5

[boards.tht]
title = "Christmas bell THT"
template = "generated_tht"
schematic = "layout_tht"
pcb = "tht"

[release]
assembly = { sides = [] }        # no assembly: the BOM is empty, everything is hand-soldered (D-12)

[scripts.kunst]                  # the silkscreen artwork of every board (D-25)
kind = "input"
cmd = ["python", "../../hardware/art/make_art.py"]
reads = ["/usr/share/fonts/opentype/urw-base35/Z003-MediumItalic.otf"]
writes = ["../../hardware/art/bell.svg",
          "../../hardware/art/small_bell.svg",
          "../../hardware/art/greeting.svg",
          "../../hardware/art/chevron.svg",
          "../../hardware/art/star.svg",
          "../../hardware/art/snowflake.svg"]
about = "Bell, greeting, chevrons, stars and snowflakes as filled shapes for the silkscreen of all five boards – in the layout hash since D-20, registered by D-25"
