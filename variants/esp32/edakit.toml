# edakit project file of the Christmas bell, variant ESP32 – reference: edakit/handbook/10-reference.md
#
# Like the variant SMD (../smd/edakit.toml), with a LILYGO T-Display V1.1 (ESP32, 1.14 inch TFT) instead of the Nano
# (D-13): 3.3 V logic, the buttons switch 3V3, yellow-green instead of emerald-green LEDs (D-14). JLCPCB's Economic
# assembly places every SMD part; the module's two 1x12 female headers are hand-soldered. Board 85 x 56 mm like the
# main board; its own board "esp32" in the EasyEDA project christmas-bell. The module's symbol, footprint and device
# are in the project library (hardware/lib/tdisplay_device.py).

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "esp32"
graph = "hardware/graph.json"
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
ground = "GND"
quantity = 5

[boards.esp32]
title = "Christmas bell ESP32"
template = "generated_esp32"
schematic = "layout_esp32"
pcb = "esp32"
revision = "1.0"                 # board revision: printed bottom left with the title (edakit silk)
view = "top"
edge_ok = ["U1", "J1"]           # the T-Display's USB-C socket at the edge, the servo plug

[boards.esp32.outline]
rect = [85, 56]
corner_radius = 2

[[boards.esp32.holes]]
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.esp32.holes]]
x = 81.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.esp32.holes]]
x = 3.5
y = 52.5
d = 3.2
keep = 3.2

[[boards.esp32.holes]]
x = 81.5
y = 52.5
d = 3.2
keep = 3.2

[boards.esp32.tooling]             # JLCPCB Economic PCBA: tooling holes, NPTH 1.152 mm
holes = [[3.5, 45], [81.5, 20]]

[boards.esp32.place]             # the T-Display where the Nano was, USB at the left edge; the rest as in the SMD variant
U1 = { x = 30.5, y = 28, rot = 270, side = "top" }  # footprint drawn upright (USB at -y): 270 puts the USB end left
LED5 = { x = 30, y = 48, rot = 0, side = "top" }
LED4 = { x = 40, y = 48, rot = 0, side = "top" }
LED3 = { x = 50, y = 48, rot = 0, side = "top" }
LED2 = { x = 60, y = 48, rot = 0, side = "top" }
LED1 = { x = 70, y = 48, rot = 0, side = "top" }
J1 = { x = 80, y = 30, rot = 90, side = "top" }
C1 = { x = 65.5, y = 30, rot = 0, side = "top" }  # next to J1 (near_mm 6)
S1 = { x = 58, y = 12, rot = 0, side = "top" }
S2 = { x = 72, y = 12, rot = 0, side = "top" }
R4 = { x = 30, y = 44, rot = 90, side = "top" }    # series resistors right below their LEDs
R3 = { x = 40, y = 44, rot = 90, side = "top" }
R2 = { x = 50, y = 44, rot = 90, side = "top" }
R1 = { x = 60, y = 44, rot = 90, side = "top" }
R5 = { x = 70, y = 44, rot = 90, side = "top" }
R7 = { x = 51.5, y = 12, rot = 90, side = "top" }  # pull-downs next to their buttons
R6 = { x = 65, y = 12, rot = 90, side = "top" }
R8 = { x = 57, y = 20.5, rot = 0, side = "top" }   # base load, 0.25 W each – apart from each other, clear of the
R9 = { x = 68, y = 20.5, rot = 0, side = "top" }   # module (the T-Display covers the place they have on the Nano board)

[boards.esp32.near]
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"
C1 = "J1"

[boards.esp32.routing]
clearance_mil = 8
signal_mil = 12
via = [24, 12]
edge_clearance_um = 400
passes = 40
attempts = 5
layer_cost = { TOP = [1.0, 1.8], BOTTOM = [1.5, 2.5] }

[boards.esp32.routing.classes]
POWER = { width_mil = 30, nets = ["+5V"] }
GND = { width_mil = 30, nets = ["GND"] }

[[boards.esp32.pours]]
net = "GND"
layers = ["TOP", "BOTTOM"]

[boards.esp32.silk]
designators = "top"
label_h_mm = 1.0
board_label = "Weihnachtsglocke ESP32 rev {revision}"   # bottom left, German like the greeting

