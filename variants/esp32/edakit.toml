# edakit project file of the Christmas bell, variant ESP32 – reference: edakit/handbook/10-reference.md
#
# Like the variant SMD (../smd/edakit.toml), with a LILYGO T-Display V1.1 (ESP32, 1.14 inch TFT) instead of the Nano
# (D-13): 3.3 V logic, the buttons switch 3V3, yellow-green instead of emerald-green LEDs (D-14). JLCPCB's Economic
# assembly places every SMD part; the module's two 1x12 female headers are hand-soldered. Board 85 x 56 mm like the
# main board; its own board "esp32" in the EasyEDA project christmas-bell. The module's symbol, footprint and device
# are in the project library (hardware/lib/tdisplay_device.py).

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "esp32"
graph = "hardware/graph.toml"
requirements = ["../../hardware/requirements.toml", "hardware/requirements.toml"]   # what the circuit must do: shared, then per module (D-32)
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
quantity = 5

[boards.esp32]
title = "Christmas bell ESP32"
template = "generated_esp32"
schematic = "layout_esp32"
pcb = "esp32"

[release]
assembly = { sides = ["top"], smd_only = true }

[scripts.kunst]                  # the silkscreen artwork of every board (D-25)
kind = "input"
cmd = ["python", "../../hardware/art/make_art.py"]
reads = ["/usr/share/fonts/opentype/urw-base35/Z003-MediumItalic.otf"]
writes = ["../../hardware/art/bell.svg",
          "../../hardware/art/small_bell.svg",
          "../../hardware/art/greeting.svg",
          "../../hardware/art/chevron.svg",
          "../../hardware/art/star.svg",
          "../../hardware/art/snowflake.svg"]
about = "Bell, greeting, chevrons, stars and snowflakes as filled shapes for the silkscreen of all five boards – in the layout hash since D-20, registered by D-25"

[scripts.tdisplay]               # the T-Display's symbol in the project library (D-13, D-25)
kind = "easyeda"
cmd = ["python", "hardware/lib/tdisplay_device.py", "symbol"]
writes = ["project-library:esp32"]
about = "Rebuilds the symbol of the stand-in C18722937's project copy into the LILYGO T-Display's (D-13); its footprint comes from footprint_data in the parts entry (D-25)"
