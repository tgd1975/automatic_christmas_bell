# Board esp32 of christmas-bell: outline, holes, placement, routing, pours, silk – the PCB designer's file,
# in the layout hash (edakit handbook 10.2)

revision = "1.0"                 # board revision: printed bottom left with the title (edakit silk)
view = "top"
edge_ok = ["U1", "J1"]           # the T-Display's USB-C socket at the edge, the servo plug

[outline]
rect = [85, 56]
corner_radius = 2

[[holes]]
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[holes]]
x = 81.5
y = 3.5
d = 3.2
keep = 3.2

[[holes]]
x = 3.5
y = 52.5
d = 3.2
keep = 3.2

[[holes]]
x = 81.5
y = 52.5
d = 3.2
keep = 3.2

[tooling]                          # JLCPCB Economic PCBA: tooling holes, NPTH 1.152 mm
holes = [[3.5, 45], [81.5, 20]]

[place]                          # the T-Display where the Nano was, USB at the left edge; the rest as in the SMD variant
U1 = { x = 30.5, y = 28, rot = 270, side = "top" }  # footprint drawn upright (USB at -y): 270 puts the USB end left
LED5 = { x = 30, y = 48, rot = 0, side = "top" }
LED4 = { x = 40, y = 48, rot = 0, side = "top" }
LED3 = { x = 50, y = 48, rot = 0, side = "top" }
LED2 = { x = 60, y = 48, rot = 0, side = "top" }
LED1 = { x = 70, y = 48, rot = 0, side = "top" }
J1 = { x = 80, y = 30, rot = 90, side = "top" }
C1 = { x = 65.5, y = 30, rot = 0, side = "top" }  # next to J1 (near_mm 6)
S1 = { x = 58, y = 12, rot = 0, side = "top" }
S2 = { x = 72, y = 12, rot = 0, side = "top" }
R4 = { x = 30, y = 44, rot = 90, side = "top" }    # series resistors right below their LEDs
R3 = { x = 40, y = 44, rot = 90, side = "top" }
R2 = { x = 50, y = 44, rot = 90, side = "top" }
R1 = { x = 60, y = 44, rot = 90, side = "top" }
R5 = { x = 70, y = 44, rot = 90, side = "top" }
R7 = { x = 51.5, y = 12, rot = 90, side = "top" }  # pull-downs next to their buttons
R6 = { x = 65, y = 12, rot = 90, side = "top" }
R8 = { x = 57, y = 20.5, rot = 0, side = "top" }   # base load, 0.25 W each – apart from each other, clear of the
R9 = { x = 68, y = 20.5, rot = 0, side = "top" }   # module (the T-Display covers the place they have on the Nano board)

[near]
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"
C1 = "J1"

[routing]
clearance_mil = 8
signal_mil = 12
via = [24, 12]
edge_clearance_um = 400
passes = 40
attempts = 5
layer_cost = { TOP = [1.0, 1.8], BOTTOM = [1.5, 2.5] }

# The anode links R -> LED as fixed top tracks (M-5): otherwise Freerouting's GND chain between the resistor and the
# LED row pushed three of them through the bottom (six vias in the visible LED row, LED4's label turned vertical).
[[routing.fixed_wires]]
net = "LED_G1_A"
layer = "TOP"
width_mil = 12
points = [[30, 45.0], [30, 45.95], [31.05, 47.0], [31.05, 48.0]]

[[routing.fixed_wires]]
net = "LED_G2_A"
layer = "TOP"
width_mil = 12
points = [[40, 45.0], [40, 45.95], [41.05, 47.0], [41.05, 48.0]]

[[routing.fixed_wires]]
net = "LED_Y1_A"
layer = "TOP"
width_mil = 12
points = [[50, 45.0], [50, 45.95], [51.05, 47.0], [51.05, 48.0]]

[[routing.fixed_wires]]
net = "LED_Y2_A"
layer = "TOP"
width_mil = 12
points = [[60, 45.0], [60, 45.95], [61.05, 47.0], [61.05, 48.0]]

[[routing.fixed_wires]]
net = "LED_R_A"
layer = "TOP"
width_mil = 12
points = [[70, 45.0], [70, 45.95], [71.05, 47.0], [71.05, 48.0]]

# No vias under the chevrons between the LEDs: a tented via shows through the print (M-5).
[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [34.2, 47.2, 35.8, 48.8]

[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [44.2, 47.2, 45.8, 48.8]

[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [54.2, 47.2, 55.8, 48.8]

[[routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [64.2, 47.2, 65.8, 48.8]

[routing.classes]
POWER = { width_mil = 30, nets = ["+5V"] }
GND = { width_mil = 30, nets = ["GND"] }

[[pours]]
net = "GND"
layers = ["TOP", "BOTTOM"]

[silk]
designators = "top"
label_h_mm = 1.0
board_label = "Weihnachtsglocke ESP32 rev {revision}"   # bottom left, German like the greeting

