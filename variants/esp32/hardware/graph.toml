# The hardware graph (handbook 3.1): components, nets and cables keyed by designator and name, pins by name
# or role through the parts entries. edakit graph json writes the resolved graph beside it (graph.json).
name = "christmas-bell-esp32"
version = "0.1"
date = "2026-10-26"
description = """\
  Automatic Christmas bell, variant ESP32 (D-13): like the SMD variant, with a LILYGO T-Display V1.1 (ESP32, 1.14 \
  inch TFT) instead of the Nano. 3.3 V logic: the buttons switch 3V3, the LEDs run from 3.3 V outputs (yellow-green \
  instead of emerald green, D-14)."""
cables = []

[purpose]
use = "private"
market = "EU"
notes = """\
  Automatic Christmas bell, ESP32 variant, for the owner's home, built and used by the owner – not sold or given \
  away (D-16). Powered through the T-Display's USB-C only – no cell at the module's battery input, no mains. The \
  T-Display's ESP32 uses Wi-Fi (2.4 GHz, channels 1-13): a web page in the owner's home network – status and \
  control of the countdown, no internet service – and a setup hotspot (WPA2) until the home network is set (D-17); \
  Bluetooth stays off."""

[conventions]
pin_reference = """\
  '<designator>.<pin>' with the pin's name or role, else its symbol number – the parts entry says which pin that is"""
v = "per net: [min, max] in V over all operating states"
accept = "per net or component: {code: reason} accepts a finding on purpose (edakit explain <code>)"

[components.U1]
type = "module"
label = "LILYGO T-Display V1.1 (plugged in)"
part = "LILYGO TTGO T-Display V1.1"
lcsc = "C18722937"
bom = false
nc = ["IO39", "IO36", "13", "IO12", "IO15", "IO2", "IO17", "IO22", "IO21"]
notes = """\
  Plugs into two 1x12 female headers, pitch 2.54 mm, rows 22.86 mm apart (hand-soldered, not in the graph). Powered \
  through its USB-C socket; its 5V pin (VBUS behind the module's 1N5819) supplies the servo and C1, its 3V3 pin \
  (AP2112K) the buttons. Strapping pins IO12/IO15/IO2 and the second 3V3 pin stay free. LCSC C18722937 is a \
  stand-in for the EasyEDA device: its symbol and footprint are rebuilt in the project (D-13)."""

[components.J1]
type = "connector"
label = "Servo (GND, +5 V, signal), SMD header"
part = "HX PZ2.54-1x3P TP-YQ"
lcsc = "C41417360"
notes = """\
  Standard servo plug: brown = GND (1), red = +5 V (2), orange = signal (3). SMD header, placed by JLCPCB (D-11)."""

[components.C1]
type = "capacitor"
label = "Buffer capacitor for the servo (SMD)"
part = "RVT1C102M1010 1000uF 16V SMD"
lcsc = "C3359"
notes = "Absorbs the servo's start-up peaks so the ESP32 does not reset. SMD can (D-11)."

[components.LED5]
type = "led"
label = "0805 LED, yellow-green, countdown step 1"
part = "KT-0805YG"
lcsc = "C2292"
notes = """\
  D-14: yellow-green (VF 1.8-2.4 V) instead of emerald green (2.6-3.1 V) – the ESP32's 3.3 V outputs do not drive \
  the emerald green reliably"""
accept."LIM.p" = "D-26 (owner, 2026-10-31): 20.7 mW at the forward-voltage minimum, 52 % of the datasheet's 40 mW – accepted, the brightness stays"

[components.R4]
type = "resistor"
label = "Series resistor LED5"
part = "100 Ω 0805"
lcsc = "C17408"
value = "100Ω"
notes = "D-14: (3.3 V - 2.1 V) / (100 Ω + 30 Ω GPIO + 10 Ω LED) = 8.6 mA typ."

[components.LED4]
type = "led"
label = "0805 LED, yellow-green, countdown step 2"
part = "KT-0805YG"
lcsc = "C2292"
notes = """\
  D-14: yellow-green (VF 1.8-2.4 V) instead of emerald green (2.6-3.1 V) – the ESP32's 3.3 V outputs do not drive \
  the emerald green reliably"""
accept."LIM.p" = "D-26 (owner, 2026-10-31): 20.7 mW at the forward-voltage minimum, 52 % of the datasheet's 40 mW – accepted, the brightness stays"

[components.R3]
type = "resistor"
label = "Series resistor LED4"
part = "100 Ω 0805"
lcsc = "C17408"
value = "100Ω"
notes = "D-14: (3.3 V - 2.1 V) / (100 Ω + 30 Ω GPIO + 10 Ω LED) = 8.6 mA typ."

[components.LED3]
type = "led"
label = "0805 LED, yellow, countdown step 3"
part = "KT-0805Y"
lcsc = "C2296"
notes = "D-11: KT-0805 series, pin 1 = anode, pin 2 = cathode (footprint mark at pad 2)"
accept."LIM.p" = "D-26 (owner, 2026-10-31): 20.7 mW at the forward-voltage minimum, 52 % of the datasheet's 40 mW – accepted, the brightness stays"

[components.R2]
type = "resistor"
label = "Series resistor LED3"
part = "100 Ω 0805"
lcsc = "C17408"
value = "100Ω"
notes = "D-14: (3.3 V - 2.1 V) / (100 Ω + 30 Ω GPIO + 10 Ω LED) = 8.6 mA typ."

[components.LED2]
type = "led"
label = "0805 LED, yellow, countdown step 4"
part = "KT-0805Y"
lcsc = "C2296"
notes = "D-11: KT-0805 series, pin 1 = anode, pin 2 = cathode (footprint mark at pad 2)"
accept."LIM.p" = "D-26 (owner, 2026-10-31): 20.7 mW at the forward-voltage minimum, 52 % of the datasheet's 40 mW – accepted, the brightness stays"

[components.R1]
type = "resistor"
label = "Series resistor LED2"
part = "100 Ω 0805"
lcsc = "C17408"
value = "100Ω"
notes = "D-14: (3.3 V - 2.1 V) / (100 Ω + 30 Ω GPIO + 10 Ω LED) = 8.6 mA typ."

[components.LED1]
type = "led"
label = "0805 LED, red, countdown step 5"
part = "KT-0805R"
lcsc = "C2295"
notes = "D-11: KT-0805 series, pin 1 = anode, pin 2 = cathode (footprint mark at pad 2)"
accept."LIM.p" = "D-26 (owner, 2026-10-31): 20.7 mW at the forward-voltage minimum, 52 % of the datasheet's 40 mW – accepted, the brightness stays"

[components.R5]
type = "resistor"
label = "Series resistor LED1"
part = "100 Ω 0805"
lcsc = "C17408"
value = "100Ω"
notes = "D-14: (3.3 V - 2.1 V) / (100 Ω + 30 Ω GPIO + 10 Ω LED) = 8.6 mA typ."

[components.S1]
type = "button"
label = "Start button"
part = "K2-1102SP-C4SC-04"
lcsc = "C127509"
notes = "1/2 and 3/4 are connected inside the button."

[components.R7]
type = "resistor"
label = "Pull-down, start button"
part = "4.7 kΩ 0805"
lcsc = "C17673"
value = "4.7kΩ"

[components.S2]
type = "button"
label = "Reset button"
part = "K2-1102SP-C4SC-04"
lcsc = "C127509"
notes = "1/2 and 3/4 are connected inside the button."

[components.R6]
type = "resistor"
label = "Pull-down, reset button"
part = "4.7 kΩ 0805"
lcsc = "C17673"
value = "4.7kΩ"

[components.R8]
type = "resistor"
label = "Base load for USB power banks (R8 ∥ R9 = 50 Ω, 100 mA)"
part = "100 Ω 2512 1 W"
lcsc = "C35218"
value = "100Ω"
notes = """\
  Keeps a power bank from switching off (D-8): without the base load the board draws about 90–150 mA (simulated; \
  the module's own current is an assumption), with it at least 176 mA."""

[components.R9]
type = "resistor"
label = "Base load for USB power banks (R8 ∥ R9 = 50 Ω, 100 mA)"
part = "100 Ω 2512 1 W"
lcsc = "C35218"
value = "100Ω"
notes = """\
  Keeps a power bank from switching off (D-8): without the base load the board draws about 90–150 mA (simulated; \
  the module's own current is an assumption), with it at least 176 mA."""

[nets."+5V"]
pins = ["C1.plus", "J1.2", "R8.1", "R9.1", "U1.5V"]
v = [0, 5.5]
notes = "5V pin of the T-Display: USB VBUS behind the module's 1N5819; supplies the servo and C1."

[nets."+3V3"]
pins = ["U1.12", "S1.a", "S2.a"]
v = [0, 3.4]
notes = "3V3 pin of the T-Display (AP2112K-3.3); switched to the inputs by the buttons (D-13)."

[nets.GND]
pins = ["C1.minus", "J1.1", "R6.2", "R7.2", "R8.2", "R9.2", "LED5.cathode", "LED4.cathode", "LED3.cathode",
        "LED2.cathode", "LED1.cathode", "U1.GND"]
v = [0, 0]

[nets.SERVO]
pins = ["J1.3", "U1.IO13"]
v = [0, 3.4]
notes = "IO13, 3.3 V PWM into the servo's signal input (D-13)."

[nets.BTN_START]
pins = ["S1.b", "R7.1", "U1.IO38"]
v = [0, 3.4]
notes = "Pressed = 3.3 V at IO38 (input only), else R7 pulls to GND (D-13)."

[nets.BTN_RESET]
pins = ["S2.b", "R6.1", "U1.IO37"]
v = [0, 3.4]
notes = "Pressed = 3.3 V at IO37 (input only), else R6 pulls to GND (D-13)."

[nets.LED_G1]
pins = ["R4.1", "U1.IO27"]
v = [0, 3.4]

[nets.LED_G1_A]
pins = ["R4.2", "LED5.anode"]
v = [0, 3.4]

[nets.LED_G2]
pins = ["R3.1", "U1.IO26"]
v = [0, 3.4]

[nets.LED_G2_A]
pins = ["R3.2", "LED4.anode"]
v = [0, 3.4]

[nets.LED_Y1]
pins = ["R2.1", "U1.IO25"]
v = [0, 3.4]

[nets.LED_Y1_A]
pins = ["R2.2", "LED3.anode"]
v = [0, 3.4]

[nets.LED_Y2]
pins = ["R1.1", "U1.IO33"]
v = [0, 3.4]

[nets.LED_Y2_A]
pins = ["R1.2", "LED2.anode"]
v = [0, 3.4]

[nets.LED_R]
pins = ["R5.1", "U1.IO32"]
v = [0, 3.4]

[nets.LED_R_A]
pins = ["R5.2", "LED1.anode"]
v = [0, 3.4]

[accept]
"HINT.bulk" = "C1 1000 µF / 16 V electrolytic on +5V, next to J1 (it buffers the module's 5V pin)"
"HINT.debounce" = "to be debounced in the ESP32 firmware like buttons.ino (50 ms); the firmware port is open (D-13)"
"HINT.esd" = "J1 is the servo's own cable inside the bell's frame, plugged once; no TVS – like the main board"

[locks.pins]
"U1.IO27" = "LED_G1"
"U1.IO26" = "LED_G2"
"U1.IO25" = "LED_Y1"
"U1.IO33" = "LED_Y2"
"U1.IO32" = "LED_R"
"U1.IO13" = "SERVO"
"U1.IO38" = "BTN_START"
"U1.IO37" = "BTN_RESET"
