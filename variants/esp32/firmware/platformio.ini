; Firmware of the ESP32 variant: LILYGO T-Display V1.1 on the carrier board variants/esp32 (D-13, D-17)
; https://docs.platformio.org/en/latest/projectconf/
;
;   pio run -e tdisplay -t upload      build and flash
;   pio test -e native                 the countdown logic (lib/BellTimer) on the host

[platformio]
default_envs = tdisplay

[env:tdisplay]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
; TFT_eSPI set up for the T-Display's ST7789V (135 x 240), as its User_Setups/Setup25_TTGO_T_Display.h
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000

[env:native]
platform = native
test_framework = unity
