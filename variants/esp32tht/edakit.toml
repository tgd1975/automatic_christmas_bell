# edakit project file of the Christmas bell, variant ESP32 THT – reference: edakit/handbook/10-reference.md
#
# The circuit of the variant ESP32 (../esp32/edakit.toml) – a LILYGO T-Display V1.1 in two 1x12 female headers, 3.3 V
# logic, yellow-green LEDs (D-13, D-14) – with the through-hole parts of the variant THT (../tht/edakit.toml) and no
# assembly: a bare board, every part soldered by hand (D-23). Board 85 x 56 mm like the main board; its own board
# "esp32tht" in the EasyEDA project christmas-bell. The module's symbol and footprint are the project-library copies
# the board esp32 rebuilt (../esp32/hardware/lib/tdisplay_device.py).

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "esp32tht"
graph = "hardware/graph.toml"
requirements = ["../../hardware/requirements.toml", "../esp32/hardware/requirements.toml"]   # what the circuit must do: shared, then per module (D-32)
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
quantity = 5
distributors = ["lcsc", "reichelt", "rs"]   # the owner's suppliers edakit knows (D-25); Berrybase, Bürklin, Tinytronics it does not

[boards.esp32tht]
title = "Christmas bell ESP32 THT"
template = "generated_esp32tht"
schematic = "layout_esp32tht"
pcb = "esp32tht"

[release]
assembly = { sides = [] }        # no assembly: the BOM is empty, everything is hand-soldered (D-23)

[[extra]]                        # the T-Display's sockets – hand-soldered, not in the graph (M-1 finding 1)
item = "female header 1x12, 2.54 mm, 8.5 mm high (KH-2.54FH-1X12P-H8.5)"
supplier = "lcsc"
code = "C2905419"
per_set = 2

[order]                          # the order form's keys (D-27): edakit's defaults otherwise – 1.6 mm, green, white, HASL
mark = "remove"                  # no order number: JLCPCB's form offers none since May 2026 (D-27)
customs = { category = "DIY", hs_code = "902300" }   # the shipment for customs: a hobby project – the owner, 2026-11-01

[cart]                           # the skill cart puts the board into JLCPCB's cart (D-27)
ship_to = "Austria"
shipping = { jlcpcb = "DHL Express" }

[cost]                           # the estimate of edakit cost, no budget (D-27)
currency = "EUR"
rates = { USD = 0.8951 }         # ECB reference rate of 2026-10-30: 1 EUR = 1.1172 USD
vat_pct = 20                     # Austrian VAT on the order (JLCPCB collects it at checkout or it is due on import)

[firmware]                       # the firmware contract of variants/esp32/firmware: U1's IO numbers (D-25)

[scripts.kunst]                  # the silkscreen artwork of every board (D-25)
kind = "input"
cmd = ["python", "../../hardware/art/make_art.py"]
reads = ["/usr/share/fonts/opentype/urw-base35/Z003-MediumItalic.otf"]
writes = ["../../hardware/art/bell.svg",
          "../../hardware/art/small_bell.svg",
          "../../hardware/art/greeting.svg",
          "../../hardware/art/chevron.svg",
          "../../hardware/art/star.svg",
          "../../hardware/art/snowflake.svg"]
about = "Bell, greeting, chevrons, stars and snowflakes as filled shapes for the silkscreen of all five boards – in the layout hash since D-20, registered by D-25"
