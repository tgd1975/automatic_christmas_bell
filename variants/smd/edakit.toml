# edakit project file of the Christmas bell, variant SMD – reference: edakit/handbook/10-reference.md
#
# The circuit of the main board (../../edakit.toml) with SMD parts wherever JLCPCB's Economic assembly can place them:
# 0805 LEDs, the servo header and the buffer capacitor as SMD parts (D-11). Only the Nano's two female headers are
# hand-soldered. Board 85 x 56 mm like the main board; its own board "smd" in the EasyEDA project christmas-bell.

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "smd"
graph = "hardware/graph.toml"
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
quantity = 5

[boards.smd]
title = "Christmas bell SMD"
template = "generated_smd"
schematic = "layout_smd"
pcb = "smd"

[release]
assembly = { sides = ["top"], smd_only = true }

[scripts.kunst]                  # the silkscreen artwork of every board (D-25)
kind = "input"
cmd = ["python", "../../hardware/art/make_art.py"]
reads = ["/usr/share/fonts/opentype/urw-base35/Z003-MediumItalic.otf"]
writes = ["../../hardware/art/bell.svg",
          "../../hardware/art/small_bell.svg",
          "../../hardware/art/greeting.svg",
          "../../hardware/art/chevron.svg",
          "../../hardware/art/star.svg",
          "../../hardware/art/snowflake.svg"]
about = "Bell, greeting, chevrons, stars and snowflakes as filled shapes for the silkscreen of all five boards – in the layout hash since D-20, registered by D-25"
