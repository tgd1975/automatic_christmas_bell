# edakit project file of the Christmas bell, variant SMD – reference: edakit/handbook/10-reference.md
#
# The circuit of the main board (../../edakit.toml) with SMD parts wherever JLCPCB's Economic assembly can place them:
# 0805 LEDs, the servo header and the buffer capacitor as SMD parts (D-11). Only the Nano's two female headers are
# hand-soldered. Board 85 x 56 mm like the main board; its own board "smd" in the EasyEDA project christmas-bell.

[project]
name = "christmas-bell"           # the EasyEDA project of the main board; this variant is its board "smd"
graph = "hardware/graph.json"
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
ground = "GND"
quantity = 5

[boards.smd]
title = "Christmas bell SMD"
template = "generated_smd"
schematic = "layout_smd"
pcb = "smd"
revision = "1.0"                 # board revision: printed bottom left with the title (edakit silk)
view = "top"
edge_ok = ["U1", "J1"]           # the Nano's USB socket at the edge, the servo plug

[boards.smd.outline]
rect = [85, 56]
corner_radius = 2

[[boards.smd.holes]]
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.smd.holes]]
x = 81.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.smd.holes]]
x = 3.5
y = 52.5
d = 3.2
keep = 3.2

[[boards.smd.holes]]
x = 81.5
y = 52.5
d = 3.2
keep = 3.2

[boards.smd.tooling]             # JLCPCB Economic PCBA: tooling holes, NPTH 1.152 mm
holes = [[3.5, 45], [81.5, 20]]

[boards.smd.place]               # as on the main board; 0805 LEDs all the same way (one footprint, D-11)
U1 = { x = 22.6, y = 28, rot = 270, side = "top" }  # footprint drawn upright: 270 puts the USB end left
LED5 = { x = 30, y = 48, rot = 0, side = "top" }
LED4 = { x = 40, y = 48, rot = 0, side = "top" }
LED3 = { x = 50, y = 48, rot = 0, side = "top" }
LED2 = { x = 60, y = 48, rot = 0, side = "top" }
LED1 = { x = 70, y = 48, rot = 0, side = "top" }
J1 = { x = 80, y = 30, rot = 90, side = "top" }
C1 = { x = 65.5, y = 30, rot = 0, side = "top" }  # next to J1 (near_mm 6)
S1 = { x = 58, y = 12, rot = 0, side = "top" }
S2 = { x = 72, y = 12, rot = 0, side = "top" }
R4 = { x = 30, y = 44, rot = 90, side = "top" }    # series resistors right below their LEDs
R3 = { x = 40, y = 44, rot = 90, side = "top" }
R2 = { x = 50, y = 44, rot = 90, side = "top" }
R1 = { x = 60, y = 44, rot = 90, side = "top" }
R5 = { x = 70, y = 44, rot = 90, side = "top" }
R7 = { x = 51.5, y = 12, rot = 90, side = "top" }  # pull-downs next to their buttons
R6 = { x = 65, y = 12, rot = 90, side = "top" }
R8 = { x = 22, y = 16.3, rot = 0, side = "top" }   # base load, 0.25 W each – apart from each other
R9 = { x = 33, y = 16.3, rot = 0, side = "top" }

[boards.smd.near]
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"
C1 = "J1"

[boards.smd.routing]
clearance_mil = 8
signal_mil = 12
via = [24, 12]
edge_clearance_um = 400
passes = 40
attempts = 5
layer_cost = { TOP = [1.0, 1.8], BOTTOM = [1.5, 2.5] }

# The Nano footprint brings four NPTH holes Ø1.9 mm at its corners (local ±7.62 / ±20.32 mm, D-7). Freerouting
# does not see them, and a track once ran 0.11 mm past one (DRC): keep tracks and vias 1.3 mm from their centres.
[[boards.smd.routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [0.98, 19.08, 3.58, 21.68]

[[boards.smd.routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [0.98, 34.32, 3.58, 36.92]

[[boards.smd.routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [41.62, 19.08, 44.22, 21.68]

[[boards.smd.routing.keepouts]]
layer = ["TOP", "BOTTOM"]
what = "all"
rect = [41.62, 34.32, 44.22, 36.92]

[boards.smd.routing.classes]
POWER = { width_mil = 30, nets = ["+5V"] }
GND = { width_mil = 30, nets = ["GND"] }

[[boards.smd.pours]]
net = "GND"
layers = ["TOP", "BOTTOM"]

[boards.smd.silk]
designators = "top"
label_h_mm = 1.0
board_label = "Weihnachtsglocke SMD rev {revision}"   # bottom left, German like the greeting

