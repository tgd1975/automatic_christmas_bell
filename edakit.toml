# edakit project file of the Christmas bell – reference: easyEDAAutomation/handbook/10-reference.md
#
# Carrier board for a plugged-in Arduino Nano: servo connector, buffer capacitor, five 5 mm LEDs, two buttons.
# Two layers, 85 x 56 mm like the Fritzing board. JLCPCB assembles only the SMD parts (resistors, buttons); the Nano's
# female headers, the LEDs, the capacitor and the servo header are hand-soldered (docs/decisions.md D-1).

[project]
name = "christmas-bell"           # EasyEDA project, created by hand once
graph = "hardware/graph.json"
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
ground = "GND"
quantity = 5

[boards.main]
title = "Christmas bell"
template = "generated_main"
schematic = "layout_main"
pcb = "main"
view = "top"
edge_ok = ["U1", "J1"]           # the Nano's USB socket at the edge, the servo plug

[boards.main.outline]
rect = [85, 56]
corner_radius = 2

[[boards.main.holes]]
x = 3.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.main.holes]]
x = 81.5
y = 3.5
d = 3.2
keep = 3.2

[[boards.main.holes]]
x = 3.5
y = 52.5
d = 3.2
keep = 3.2

[[boards.main.holes]]
x = 81.5
y = 52.5
d = 3.2
keep = 3.2

[boards.main.tooling]            # JLCPCB Economic PCBA: tooling holes, NPTH 1.152 mm
holes = [[3.5, 45], [81.5, 20]]

[boards.main.place]              # Nano on the left with its USB socket at the edge, LEDs on top in countdown order
U1 = { x = 22.6, y = 28, rot = 0, side = "top" }
LED5 = { x = 30, y = 48, rot = 0, side = "top" }
LED4 = { x = 40, y = 48, rot = 0, side = "top" }
LED3 = { x = 50, y = 48, rot = 0, side = "top" }
LED2 = { x = 60, y = 48, rot = 0, side = "top" }
LED1 = { x = 70, y = 48, rot = 0, side = "top" }
J1 = { x = 80, y = 30, rot = 90, side = "top" }
C1 = { x = 64, y = 30, rot = 0, side = "top" }
S1 = { x = 58, y = 12, rot = 0, side = "top" }
S2 = { x = 72, y = 12, rot = 0, side = "top" }

[boards.main.near]
R4 = "LED5"
R3 = "LED4"
R2 = "LED3"
R1 = "LED2"
R5 = "LED1"
R7 = "S1"
R6 = "S2"

[boards.main.routing]
clearance_mil = 8
signal_mil = 12
via = [24, 12]
edge_clearance_um = 400
passes = 40
attempts = 5
layer_cost = { TOP = [1.0, 1.8], BOTTOM = [1.5, 2.5] }

[boards.main.routing.classes]
POWER = { width_mil = 30, nets = ["+5V"] }
GND = { width_mil = 30, nets = ["GND"] }

[[boards.main.pours]]
net = "GND"
layers = ["TOP", "BOTTOM"]

[boards.main.silk]
designators = "top"
label_h_mm = 1.0

[schematic]
stub = 10

[schematic.layout]
power_flags = { GND = "Ground", "+5V" = "Power" }
rows = [
  [ [ { title = "Arduino Nano", start = ["U1"] } ], [ { title = "Servo", start = ["J1"] } ] ],
  [ [ { title = "Notes" } ] ],
]
near = { C1 = "J1" }

[schematic.layout.notes]
"Arduino Nano" = ["Plugged into two 1x15 female headers, powered through its USB socket",
                  "D2-D6: countdown LEDs, D8: servo, D11/D12: start/reset buttons"]
Servo = ["Servo at the Nano's 5V pin; C1 buffers its start-up peaks"]
Notes = ["Nets with the same name are connected (labels and power flags)."]

[schematic.layout.pin_table]
component = "U1"
block = "Arduino Nano"
prefix = "D"
notes = { LED_G1 = "out, green 1", LED_G2 = "out, green 2", LED_Y1 = "out, yellow 1", LED_Y2 = "out, yellow 2", LED_R = "out, red", SERVO = "out, servo PWM", BTN_START = "in, pull-down", BTN_RESET = "in, pull-down" }

[sim]
config = "hardware/sim.json"

[checks]
pin_locks = { "U1.5" = "LED_Y1", "U1.6" = "LED_Y2", "U1.7" = "LED_R", "U1.8" = "LED_G2", "U1.9" = "LED_G1", "U1.11" = "SERVO", "U1.14" = "BTN_START", "U1.15" = "BTN_RESET" }

[release]
signoff = "hardware/signoff.json"
layout_files = ["edakit.toml"]
assembly = { sides = ["top"], smd_only = true }
