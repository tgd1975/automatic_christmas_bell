# edakit project file of the Christmas bell – reference: edakit/handbook/10-reference.md
#
# Carrier board for a plugged-in Arduino Nano: servo connector, buffer capacitor, five 5 mm LEDs, two buttons.
# Two layers, 85 x 56 mm like the Fritzing board. JLCPCB assembles only the SMD parts (resistors, buttons); the Nano's
# female headers, the LEDs, the capacitor and the servo header are hand-soldered (docs/decisions.md D-1).

[project]
name = "christmas-bell"           # EasyEDA project, created by hand once
graph = "hardware/graph.toml"
requirements = ["hardware/requirements.toml", "hardware/requirements_nano.toml"]   # what the circuit must do: shared, then per module (D-32)
parts = "hardware/parts"
artifacts = "build/edakit"
reports = "build/release"
company = "Christmas bell"
quantity = 5
distributors = ["lcsc", "reichelt", "rs"]   # the owner's suppliers edakit knows (D-25); Berrybase, Bürklin, Tinytronics it does not

[boards.main]
title = "Christmas bell"
template = "generated_main"
schematic = "layout_main"
pcb = "main"

[release]
assembly = { sides = ["top"], smd_only = true }
archive = "none"                 # gate runs are build output (D-22)
publish = { variants = true, decisions = "docs/decisions.md" }   # edakit release publish of all five boards (D-29)

[order]                          # the order form's keys (D-27): edakit's defaults otherwise – 1.6 mm, green, white, HASL
mark = "remove"                  # no order number: JLCPCB's form offers none since May 2026 (D-27)

[cart]                           # the skill cart puts the board into JLCPCB's cart (D-27)
ship_to = "Austria"
shipping = { jlcpcb = "DHL Express" }

[cost]                           # the estimate of edakit cost, no budget (D-27)
currency = "EUR"
rates = { USD = 0.8951 }         # ECB reference rate of 2026-10-30: 1 EUR = 1.1172 USD
vat_pct = 20                     # Austrian VAT on the order (JLCPCB collects it at checkout or it is due on import)

[[extra]]                        # the Nano's sockets – hand-soldered, not in the graph (D-25)
item = "female header 1x15, 2.54 mm, 8.5 mm high (2541FV-15P-B), holes 1.1 mm as its datasheet recommends"
supplier = "lcsc"
code = "C25503121"
per_set = 2

[docs]                           # values quoted from the simulation (D-35)
files = ["hardware/README.md"]

[scripts.kunst]                  # the silkscreen artwork of every board (D-25)
kind = "input"
cmd = ["python", "hardware/art/make_art.py"]
reads = ["/usr/share/fonts/opentype/urw-base35/Z003-MediumItalic.otf"]
writes = ["hardware/art/bell.svg",
          "hardware/art/small_bell.svg",
          "hardware/art/greeting.svg",
          "hardware/art/chevron.svg",
          "hardware/art/star.svg",
          "hardware/art/snowflake.svg"]
about = "Bell, greeting, chevrons, stars and snowflakes as filled shapes for the silkscreen of all five boards – in the layout hash since D-20, registered by D-25"
