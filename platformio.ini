; PlatformIO Configuration for Automatic Christmas Bell
; https://docs.platformio.org/en/latest/projectconf/

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.2.1

[env:uno]
board = uno
src_dir = src/firmware

[env:nano]
board = nanoatmega328
src_dir = src/firmware

[env:nano_new]
board = nanoatmega328new
src_dir = src/firmware
